app = "moby-sst-backend-prod"
primary_region = "gru"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  COOKIE_SAME_SITE = "none"
  COOKIE_SECURE = "true"
  LIBREOFFICE_BIN = "soffice"
  PRIVATE_STORAGE_ROOT = "/data/private"

[deploy]
  release_command = "pnpm --filter backend prisma:deploy"
  release_command_timeout = "10m"
  strategy = "rolling"
  wait_timeout = "10m"

[[mounts]]
  source = "backend_storage"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/api/setup/status"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
