version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moby_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moby_dev
      POSTGRES_USER: moby
      POSTGRES_PASSWORD: moby_local_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moby -d moby_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moby_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
