services:
  - type: web
    name: moby-sst-backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deploy/render/backend.Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/setup/status
    buildFilter:
      paths:
        - apps/backend/**
        - packages/shared/**
        - deploy/render/backend.Dockerfile
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: 'true'
      - key: LIBREOFFICE_BIN
        value: soffice
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
